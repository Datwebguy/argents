<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16221c"/>
      <stop offset="50%" stop-color="#101715"/>
      <stop offset="100%" stop-color="#0a0f0e"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8fca2"/>
      <stop offset="100%" stop-color="#bfe853"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#25352c" stroke-width="2"/>

  <!-- Brand Mark - Perfectly Centered (Margins: L=66.1px, R=67.0px, T=116px, B=116px) -->
  <g transform="translate(215, 116) skewX(-28)" filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="0" y="140" width="60" height="140" rx="24" fill="url(#barGrad)" opacity="0.62"/>
    <!-- Bar 2 -->
    <rect x="85" y="65" width="60" height="215" rx="24" fill="url(#barGrad)" opacity="0.83"/>
    <!-- Bar 3 -->
    <rect x="170" y="0" width="60" height="280" rx="24" fill="url(#barGrad)"/>
  </g>
</svg>
